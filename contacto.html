<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
</head>
<body>
    <header>
        <h1>Contacto</h1>
    </header>

    <section>
        <aside>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="biografia.html">Biografía</a></li>
                    <li><a href="portfolio.html">Portfolio</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>
        </aside>

        <main>
            <h2>Contacta conmigo</h2>

            <form>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@email.com">

                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" placeholder="600 000 000">

                <label for="motivo">Motivo de contacto:</label>
                <select id="motivo" name="motivo">
                    <option>Consulta</option>
                    <option>Trabajo</option>
                    <option>Otro</option>
                </select>

                <p>¿Cómo prefieres que te contacte?</p>

                <input type="radio" id="porEmail" name="contacto" value="email">
                <label for="porEmail">Email</label>

                <input type="radio" id="porTelefono" name="contacto" value="telefono">
                <label for="porTelefono">Teléfono</label>

                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje"></textarea>

                <input type="checkbox" id="privacidad" name="privacidad">
                <label for="privacidad">Acepto la política de privacidad</label>

                <input type="submit" value="Enviar">
                <input type="reset" value="Borrar">
            </form>
        </main>
    </section>

    <footer>
        <p>Web personal de Carlos Rodríguez Ruiz</p>
    </footer>
</body>
</html>
